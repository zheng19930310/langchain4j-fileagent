# Langchain4J FileAgent 配置示例
server:
  port: 8081

spring:
  application:
    name: langchain4j-fileagent

# Langchain4J 配置（支持OpenAI兼容API）
langchain4j:
  openai:
    # 阿里云通义千问 API Key
    # 获取地址: https://dashscope.console.aliyun.com/
    api-key: sk-7cd634dd9ae74193ab9c8d28d8909c23
    model: qwen-turbo  # 可选模型: qwen-turbo, qwen-plus, qwen-max
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

# 文件操作配置
file-agent:
  # 允许操作的基础目录（安全限制）
  allowed-base-paths:
    - D:/workspace
    - C:/temp
    - ./data
